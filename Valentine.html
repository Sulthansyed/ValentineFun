<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Mobile-friendly viewport (don't lock zoom; iOS safe areas) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Will You Be My Valentine?</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">
  <style>
    :root{
      --primary-red:#d00000;
      --bg-white:#fffafa;
      --text-dark:#370617;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    html, body{
      margin:0;
      padding:0;
      width:100%;
      height:100%;
      background:var(--bg-white);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      /* Use modern viewport units for mobile */
      min-height: 100svh;
      overflow:hidden;
      touch-action: manipulation;
    }

    body{
      display:flex;
      align-items:center;
      justify-content:center;
    }

    #particle-canvas{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      z-index:1;
      pointer-events:none; /* IMPORTANT: never steal taps */
    }

    .content-wrapper{
      position:relative;
      z-index:10;
      text-align:center;
      width:min(92vw, 720px);
      padding: clamp(14px, 3vw, 22px);
    }

    h1{
      color:var(--text-dark);
      font-size: clamp(1.8rem, 8.5vw, 3.5rem);
      font-weight:800;
      margin: 0 0 1.6rem 0;
      line-height:1.15;
    }

    .btn-container{
      display:flex;
      justify-content:center;
      align-items:center;
      gap: 14px;
      min-height: 140px;
      flex-wrap: wrap;
    }

    @media (max-width: 420px){
      .btn-container{
        flex-direction: column;
        gap: 12px;
        min-height: 190px;
      }
      button{
        width: 82vw;
        max-width: 360px;
      }
    }

    button{
      padding: 14px 34px;
      font-size: 1.1rem;
      font-weight: 800;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.12s ease;
      -webkit-tap-highlight-color: transparent;
      user-select:none;
    }
    button:active{ transform: scale(0.98); }

    #yesBtn{
      background: var(--primary-red);
      color:#fff;
      box-shadow: 0 10px 24px rgba(208,0,0,.22);
      z-index:12;
    }

    #noBtn{
      background:#fff;
      color: var(--primary-red);
      border: 2px solid var(--primary-red);
      position: relative;
      z-index:11;
      /* force touch events to be delivered to us */
      touch-action: none;
    }

    #success{ display:none; }
    .heart-icon{ color:var(--primary-red); font-size: 5rem; margin-bottom: 10px; }
  </style>
</head>
<body>

  <canvas id="particle-canvas"></canvas>

  <div class="content-wrapper" id="main-ui">
    <h1>Will you be my Valentine?</h1>
    <div class="btn-container" id="btnWrap">
      <button id="yesBtn" type="button">Yes</button>
      <button id="noBtn" type="button">No</button>
    </div>
  </div>

  <div class="content-wrapper" id="success">
    <div class="heart-icon">❤️</div>
    <h1>Yay! ❤️</h1>
    <p style="font-size:1.2rem; color:var(--text-dark); margin:0;">I knew you'd say yes!</p>
  </div>

  <script>
    // ---------------------------
    // 1) Background particles
    // ---------------------------
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d', { alpha: true });
    let particles = [];
    const pointer = { x: -1000, y: -1000, radius: 110 };

    function getViewport(){
      // visualViewport is best on iOS/Android because URL bars change innerHeight
      const vv = window.visualViewport;
      const w = vv ? vv.width : document.documentElement.clientWidth;
      const h = vv ? vv.height : document.documentElement.clientHeight;
      return { w, h };
    }

    function initCanvas(){
      const { w, h } = getViewport();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      createParticles();
    }

    function updatePointerFromTouch(e){
      if (!e.touches || !e.touches.length) return;
      pointer.x = e.touches[0].clientX;
      pointer.y = e.touches[0].clientY;
    }
    function updatePointerFromMouse(e){
      pointer.x = e.clientX;
      pointer.y = e.clientY;
    }

    window.addEventListener('mousemove', updatePointerFromMouse, { passive: true });
    window.addEventListener('touchmove', updatePointerFromTouch, { passive: true });
    window.addEventListener('touchstart', updatePointerFromTouch, { passive: true });

    class Particle{
      constructor(x,y){
        this.x=x; this.y=y;
        this.baseX=x; this.baseY=y;
        this.size = Math.random() * 3 + 1;
        this.density = (Math.random() * 26) + 10;
      }
      draw(){
        ctx.fillStyle = 'rgba(208, 0, 0, 0.5)';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
        ctx.fill();
      }
      update(){
        const dx = pointer.x - this.x;
        const dy = pointer.y - this.y;
        const dist = Math.sqrt(dx*dx + dy*dy);

        // iOS can sometimes produce dist=0 exactly on touch -> guard it
        if (dist > 0 && dist < pointer.radius){
          const force = (pointer.radius - dist) / pointer.radius;
          this.x -= (dx / dist) * force * this.density;
          this.y -= (dy / dist) * force * this.density;
        } else {
          this.x -= (this.x - this.baseX) / 10;
          this.y -= (this.y - this.baseY) / 10;
        }
      }
    }

    function createParticles(){
      particles = [];
      const { w, h } = getViewport();
      const gap = w < 600 ? 44 : 30;
      for (let y=0; y<h; y+=gap){
        for (let x=0; x<w; x+=gap){
          particles.push(new Particle(x,y));
        }
      }
    }

    function animate(){
      const { w, h } = getViewport();
      ctx.clearRect(0, 0, w, h);
      for (const p of particles){ p.update(); p.draw(); }
      requestAnimationFrame(animate);
    }

    // ---------------------------
    // 2) "No" button - guaranteed mobile trap
    // ---------------------------
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');

    function moveNoButton(e){
      // On mobile Chrome, touch listeners may be passive unless we set passive:false.
      // So we attach with passive:false and preventDefault safely here.
      if (e && e.cancelable) e.preventDefault();

      noBtn.style.position = 'fixed';

      const { w, h } = getViewport();

      // Safe-area + padding
      const pad = 14;
      const safeTop = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-top')) || 0;
      const safeRight = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-right')) || 0;
      const safeBottom = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-bottom')) || 0;
      const safeLeft = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-left')) || 0;

      const bw = noBtn.offsetWidth || 140;
      const bh = noBtn.offsetHeight || 52;

      const minX = pad + safeLeft;
      const minY = pad + safeTop;
      const maxX = Math.max(minX, w - bw - pad - safeRight);
      const maxY = Math.max(minY, h - bh - pad - safeBottom);

      const x = minX + Math.random() * (maxX - minX);
      const y = minY + Math.random() * (maxY - minY);

      noBtn.style.left = x + 'px';
      noBtn.style.top  = y + 'px';
    }

    // Desktop hover
    noBtn.addEventListener('mouseenter', moveNoButton);

    // Mobile: move on touchstart AND touchmove so it *always* escapes
    noBtn.addEventListener('touchstart', moveNoButton, { passive: false });
    noBtn.addEventListener('touchmove', moveNoButton, { passive: false });

    // Extra safety: stop real "click"
    noBtn.addEventListener('click', (e) => { e.preventDefault(); moveNoButton(e); });

    function accept(){
      document.getElementById('main-ui').style.display = 'none';
      document.getElementById('success').style.display = 'block';
      pointer.radius = 2200;
    }
    yesBtn.addEventListener('click', accept);

    // Resize handling (includes URL bar expand/collapse on iOS via visualViewport)
    window.addEventListener('resize', initCanvas);
    if (window.visualViewport){
      window.visualViewport.addEventListener('resize', initCanvas);
    }

    initCanvas();
    animate();
  </script>
</body>
</html>
